name: ci

on:
  push:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node:
          - "26"
          - "24"
          - "22"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable && rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
      - run: vp --version
      - run: vp install
      - run: vp run build
      - run: vp run lint
      - run: vp run typecheck

  slack_notify:
    needs: [ci]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          notify_mode: failure_and_fixed
