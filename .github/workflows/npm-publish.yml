name: npm-publish

on:
  push:
    tags:
      - "mp4-media-stream-*"
      - "noise-suppression-*"
      - "virtual-background-*"

permissions:
  id-token: write
  contents: read

jobs:
  determine-package:
    name: Determine Package
    runs-on: ubuntu-24.04
    outputs:
      package_name: ${{ steps.package.outputs.name }}
      package_dir: ${{ steps.package.outputs.dir }}
      is_canary: ${{ steps.package.outputs.is_canary }}
    steps:
      - name: Extract package info from tag
        id: package
        run: |
          TAG="${{ github.ref_name }}"
          IS_CANARY="false"

          # canaryタグかチェック
          if [[ "$TAG" == *-canary ]]; then
            IS_CANARY="true"
            # -canaryサフィックスを削除
            TAG="${TAG%-canary}"
          fi

          # パッケージ名を抽出（最後の-vXXXX部分を除去）
          PACKAGE_NAME=$(echo "$TAG" | sed 's/-v[^-]*$//')

          # パッケージディレクトリを決定
          case "$PACKAGE_NAME" in
            "mp4-media-stream")
              PACKAGE_DIR="packages/mp4-media-stream"
              ;;
            "noise-suppression")
              PACKAGE_DIR="packages/noise-suppression"
              ;;
            "virtual-background")
              PACKAGE_DIR="packages/virtual-background"
              ;;
            *)
              echo "Unknown package: $PACKAGE_NAME"
              exit 1
              ;;
          esac

          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "dir=$PACKAGE_DIR" >> $GITHUB_OUTPUT
          echo "is_canary=$IS_CANARY" >> $GITHUB_OUTPUT

          echo "Package: $PACKAGE_NAME"
          echo "Directory: $PACKAGE_DIR"
          echo "Is Canary: $IS_CANARY"

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [determine-package]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
      - run: vp --version
      - run: vp install
      - run: vp run --filter @shiguredo/${{ needs.determine-package.outputs.package_name }} build
      - run: vp run --filter @shiguredo/${{ needs.determine-package.outputs.package_name }} lint
      - run: vp run --filter @shiguredo/${{ needs.determine-package.outputs.package_name }} typecheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.determine-package.outputs.package_name }}-dist
          path: ${{ needs.determine-package.outputs.package_dir }}/dist/

  npm-publish-canary:
    runs-on: ubuntu-24.04
    needs: [determine-package, build]
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.determine-package.outputs.is_canary == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.determine-package.outputs.package_name }}-dist
          path: ${{ needs.determine-package.outputs.package_dir }}/dist/

      # pnpm publish は CI では正常に動作しない
      # https://github.com/pnpm/pnpm/issues/4937
      - run: npm install -g npm@latest
      - run: npm publish --no-git-checks --tag canary
        working-directory: ${{ needs.determine-package.outputs.package_dir }}

  npm-publish:
    runs-on: ubuntu-24.04
    needs: [determine-package, build]
    permissions:
      contents: read
      id-token: write
    if: ${{ needs.determine-package.outputs.is_canary == 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.determine-package.outputs.package_name }}-dist
          path: ${{ needs.determine-package.outputs.package_dir }}/dist/

      # pnpm publish は CI では正常に動作しない
      # https://github.com/pnpm/pnpm/issues/4937
      - run: npm install -g npm@latest
      - run: npm publish --no-git-checks
        working-directory: ${{ needs.determine-package.outputs.package_dir }}

  slack_notify:
    needs: [npm-publish-canary, npm-publish]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: media-processors
          notify_mode: failure_and_fixed
